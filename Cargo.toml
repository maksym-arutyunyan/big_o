[package]
name = "big_o"
description = "Infers asymptotic computational complexity"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
authors = ["Maksym Arutyunyan"]
repository = "https://github.com/maksym-arutyunyan/big_o"
homepage = "https://github.com/maksym-arutyunyan/big_o"
documentation = "https://docs.rs/big_o/"
readme = "README.md"
license = "Apache-2.0"
keywords = ["big_o", "complexity", "analysis", "performance", "algorithm"]
categories = ["development-tools", "development-tools::profiling", "development-tools::testing"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Optional: `Serialize`/`Deserialize` on the result types, for persisting an
# inference and comparing verdicts across runs (CI baselines and the like).
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
assert_approx_eq = "1.1.0"
proptest = "1"
# float_roundtrip: a stored verdict must parse back to the exact written
# value, or a baseline comparison drifts by an ulp per round trip.
serde_json = { version = "1", features = ["float_roundtrip"] }
