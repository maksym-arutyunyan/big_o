# Third-party actions are pinned to a full commit SHA, never a tag. A tag is a
# movable pointer: whoever can write to the action's repository can repoint it
# at anything, and every workflow using that tag runs the new code on its next
# build, with nothing changed here to review. A commit SHA is content-addressed,
# so what runs is what was reviewed.
#
# The trailing comment on each pin is the bare version and nothing else, because
# that is the form Dependabot rewrites along with the SHA. Anything more and the
# label is left behind when the SHA moves, and a comment that misstates what is
# running is worse than none. `scripts/check-action-pins.sh` enforces the form.

name: CI

on:
  pull_request:
    branches:
      - main
  # Runs on main too, so the status badge reflects the branch it claims to.
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger for any branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  TERM: xterm-256color

jobs:
  # One job, one build. Splitting format, lint and test across jobs meant
  # compiling the crate three times over to run three commands against the
  # same code, and gating all three behind a fourth build that only built it.
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check action pins
        run: ./scripts/check-action-pins.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D clippy::all

      # Includes the bounded accuracy sweep. The wider one is scheduled.
      - name: Test
        run: cargo test --all-features
